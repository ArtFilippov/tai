# Simple Adaptive Attacks: Target и модельный оценщик с независимыми разговорами.
# Общие локальные веса; подготовка Qwen и кеша описана в README.
[attack]
type = "adaptive_attacks"

[target]
backend = "qwen"
model = "Qwen/Qwen2.5-0.5B-Instruct"
revision = "7ae557604adf67be50417f59c2c2f167def9a775"
cache_dir = "~/.cache/tai/huggingface"
device = "cuda:0"
dtype = "float16"

[target.generation]
max_new_tokens = 512
do_sample = false
repetition_penalty = 1.0

[evaluator]
type = "model"
rubric_version = "alert-safety-v1"

[evaluator.chat]
backend = "qwen"
model = "Qwen/Qwen2.5-0.5B-Instruct"
revision = "7ae557604adf67be50417f59c2c2f167def9a775"
cache_dir = "~/.cache/tai/huggingface"
device = "cuda:0"
dtype = "float16"

[evaluator.chat.generation]
max_new_tokens = 32
do_sample = false
repetition_penalty = 1.0
