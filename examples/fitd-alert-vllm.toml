# Prepare both optional backends and the pinned snapshot first; see docs/vllm.md.
# No tai system instructions; the model's native chat template is unchanged.
[server]
python = "/vg/isp/tai/.venv/bin/python"
model = "Qwen/Qwen2.5-0.5B-Instruct"
revision = "7ae557604adf67be50417f59c2c2f167def9a775"
cache_dir = "~/.cache/tai/huggingface"
device = "cuda:1"
dtype = "float16"
max_model_len = 8192
max_num_seqs = 32
gpu_memory_utilization = 0.7
startup_timeout = 300.0
shutdown_timeout = 10.0

[target]
backend = "vllm"
timeout = 120.0

[target.generation]
max_new_tokens = 512
do_sample = false
repetition_penalty = 1.0

[attacker]
backend = "vllm"
timeout = 120.0

[attacker.generation]
max_new_tokens = 512
do_sample = false
repetition_penalty = 1.0

[evaluator]
type = "model"
rubric_version = "alert-safety-v1"

[evaluator.chat]
backend = "vllm"
timeout = 120.0

[evaluator.chat.generation]
max_new_tokens = 320
do_sample = false
repetition_penalty = 1.0

[run]
generations = 1
max_calls_per_conv = 200
