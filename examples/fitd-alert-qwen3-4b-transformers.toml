# #32: Qwen3-4B Attacker, Qwen2.5-0.5B Target and evaluator on Transformers.
# No tai system instructions; native tokenizer chat templates are unchanged.
# Requires both pinned snapshots in the mounted /vg/mnt/titan Hub cache.
# Select the physical GPU with CUDA_VISIBLE_DEVICES=<GPU UUID> (cuda:0 in the mask).
[target]
backend = "qwen"
model = "Qwen/Qwen2.5-0.5B-Instruct"
revision = "7ae557604adf67be50417f59c2c2f167def9a775"
cache_dir = "/vg/mnt/titan"
device = "cuda:0"
dtype = "float16"

[target.generation]
max_new_tokens = 512
do_sample = false
repetition_penalty = 1.0

[attacker]
backend = "qwen"
model = "Qwen/Qwen3-4B-Instruct-2507"
revision = "cdbee75f17c01a7cc42f958dc650907174af0554"
cache_dir = "/vg/mnt/titan"
device = "cuda:0"
dtype = "float16"

[attacker.generation]
max_new_tokens = 512
do_sample = false
repetition_penalty = 1.0

[evaluator]
type = "model"
rubric_version = "alert-safety-v1"

[evaluator.chat]
backend = "qwen"
model = "Qwen/Qwen2.5-0.5B-Instruct"
revision = "7ae557604adf67be50417f59c2c2f167def9a775"
cache_dir = "/vg/mnt/titan"
device = "cuda:0"
dtype = "float16"

[evaluator.chat.generation]
max_new_tokens = 320
do_sample = false
repetition_penalty = 1.0

[run]
generations = 1
# Library rounds, not a total model-call budget.
max_calls_per_conv = 10
