# ALERT on Transformers: same model, prompts and generation budgets as fitd-alert-vllm.toml.
# No tai system instructions; the model's native chat template is unchanged.
# Select the physical GPU with CUDA_VISIBLE_DEVICES=<GPU UUID>; all roles use cuda:0 inside that mask.
# Install with uv sync --locked --group dev --extra qwen. Commands: README.
[target]
backend = "qwen"
model = "Qwen/Qwen2.5-0.5B-Instruct"
revision = "7ae557604adf67be50417f59c2c2f167def9a775"
cache_dir = "~/.cache/tai/huggingface"
device = "cuda:0"
dtype = "float16"

[target.generation]
max_new_tokens = 512
do_sample = false
repetition_penalty = 1.0

[attacker]
backend = "qwen"
model = "Qwen/Qwen2.5-0.5B-Instruct"
revision = "7ae557604adf67be50417f59c2c2f167def9a775"
cache_dir = "~/.cache/tai/huggingface"
device = "cuda:0"
dtype = "float16"

[attacker.generation]
max_new_tokens = 512
do_sample = false
repetition_penalty = 1.0

[evaluator]
type = "model"
rubric_version = "alert-safety-v1"

[evaluator.chat]
backend = "qwen"
model = "Qwen/Qwen2.5-0.5B-Instruct"
revision = "7ae557604adf67be50417f59c2c2f167def9a775"
cache_dir = "~/.cache/tai/huggingface"
device = "cuda:0"
dtype = "float16"

[evaluator.chat.generation]
max_new_tokens = 320
do_sample = false
repetition_penalty = 1.0

[run]
generations = 1
# Library rounds, not a total model-call budget.
max_calls_per_conv = 200
