# Bad Characters/deletion: до 8 позиций × 4 ASCII-символов при одной вставке.
# Target и модельный оценщик используют независимые разговоры и общие веса.
[attack]
type = "badchars_deletion"
perturbation_budget = 1
max_position_candidates = 8
max_ascii_variants = 4

[target]
backend = "qwen"
model = "Qwen/Qwen2.5-0.5B-Instruct"
revision = "7ae557604adf67be50417f59c2c2f167def9a775"
cache_dir = "~/.cache/tai/huggingface"
device = "cuda:0"
dtype = "float16"

[target.generation]
max_new_tokens = 512
do_sample = false
repetition_penalty = 1.0

[evaluator]
type = "model"
rubric_version = "alert-safety-v1"

[evaluator.chat]
backend = "qwen"
model = "Qwen/Qwen2.5-0.5B-Instruct"
revision = "7ae557604adf67be50417f59c2c2f167def9a775"
cache_dir = "~/.cache/tai/huggingface"
device = "cuda:0"
dtype = "float16"

[evaluator.chat.generation]
max_new_tokens = 32
do_sample = false
repetition_penalty = 1.0
