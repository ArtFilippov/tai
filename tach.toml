source_roots = ["src"]
exact = true
ignore_type_checking_imports = false
root_module = "forbid"
forbid_circular_dependencies = true
layers_explicit_depends_on = true
respect_gitignore = false
# Packages group cohesive components; file boundaries retain their layer checks.
# Contract package exports stay independent of concrete adapters and assembly.
layers = ["Bootstrap", "Interface", "Infrastructure", "UseCase", "Domain"]
exclude = [".git/**", "**/.git/**", ".venv/**", "**/.venv/**", "venv/**", "**/venv/**", "__pycache__/**", "**/__pycache__/**", ".mypy_cache/**", "**/.mypy_cache/**", ".pytest_cache/**", "**/.pytest_cache/**", ".ruff_cache/**", "**/.ruff_cache/**", ".tox/**", "**/.tox/**", ".nox/**", "**/.nox/**", ".quality/**", "**/.quality/**", "node_modules/**", "**/node_modules/**", "build/**", "**/build/**", "dist/**", "**/dist/**", "vendor/**", "**/vendor/**", "vendored/**", "**/vendored/**", "_vendor/**", "**/_vendor/**", "generated/**", "**/generated/**", "_generated/**", "**/_generated/**", "migrations/**", "**/migrations/**", "tests/**", "**/tests/**", "**/test/**"]

[[modules]]
path = "tai"
layer = "Bootstrap"
depends_on = [
    "alert",
    "attacks.fitd",
    "core.chats",
    "core.chats.openai",
    "core.chats.qwen",
    "core.evaluation",
    "core.evaluation.assembly",
    "core.evaluation.model_evaluator",
    "core.evaluation.text_evaluator",
    "core.primitives.messages",
    "core.runs",
    "core.runs.journal",
    "core.runs.storage",
]

[[modules]]
path = "alert"
layer = "Domain"
depends_on = ["alert.manifest"]

[[modules]]
path = "alert.manifest"
layer = "Domain"
depends_on = ["alert.taxonomy"]

[[modules]]
path = "alert.preparation"
layer = "Infrastructure"
cannot_depend_on = ["alert.report", "app.preflight", "app.series", "attacks.fitd.user"]
depends_on = ["alert.manifest"]

[[modules]]
path = "alert.report"
layer = "UseCase"
depends_on = ["alert.manifest", "alert.taxonomy", "core.runs.storage"]

[[modules]]
path = "alert.taxonomy"
layer = "Domain"
depends_on = []

[[modules]]
path = "app"
layer = "Bootstrap"
depends_on = []

[[modules]]
path = "app.cli"
layer = "Bootstrap"
depends_on = [
    "alert.manifest",
    "alert.preparation",
    "alert.report",
    "app.configuration",
    "app.preflight",
    "app.series",
    "app.terminal",
    "core.primitives.messages",
]

[[modules]]
path = "app.configuration"
layer = "Bootstrap"
depends_on = [
    "attacks.fitd",
    "core.chats",
    "core.chats.openai",
    "core.chats.qwen",
    "core.evaluation.assembly",
    "core.evaluation.model_evaluator",
    "core.primitives.diagnostics",
    "core.primitives.messages",
]

[[modules]]
path = "app.preflight"
layer = "UseCase"
depends_on = [
    "app.configuration",
    "core.chats",
    "core.chats.conversation",
    "core.evaluation",
    "core.evaluation.observation",
    "core.primitives.messages",
    "core.runs",
    "core.runs.journal",
    "core.runs.operations",
]

[[modules]]
path = "app.series"
layer = "UseCase"
depends_on = [
    "alert",
    "alert.report",
    "app.configuration",
    "attacks.fitd",
    "attacks.fitd.garak_adapter",
    "attacks.fitd.profile",
    "core.primitives.diagnostics",
    "core.primitives.messages",
    "core.runs",
    "core.runs.storage",
]

[[modules]]
path = "app.terminal"
layer = "Interface"
cannot_depend_on = [
    "alert.preparation",
    "attacks.fitd.garak_adapter",
    "core.chats.http_worker",
    "core.chats.openai",
    "core.chats.qwen",
    "core.evaluation.observation",
    "core.runs.journal",
    "core.runs.storage",
]
depends_on = ["attacks.fitd", "core.runs", "core.runs.storage"]

[[modules]]
path = "attacks"
layer = "Bootstrap"
depends_on = []

[[modules]]
path = "attacks.fitd"
layer = "Bootstrap"
