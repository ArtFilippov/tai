depends_on = [
    "attacks.fitd.profile",
    "core.chats",
    "core.primitives.messages",
    "core.runs.operations",
]

[[modules]]
path = "attacks.fitd.profile"
layer = "Domain"
depends_on = []

[[modules]]
path = "attacks.fitd.user"
layer = "UseCase"
depends_on = [
