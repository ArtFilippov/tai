from = ['^tai$']
expose = [
    '^AutoDANExperiment$',
    '^AutoDANUser$',
    '^AdaptiveAttacksExperiment$',
    '^AdaptiveAttacksUser$',
    '^AlertManifest$',
    '^AlertRecord$',
    '^BadCharactersDeletionExperiment$',
    '^BadCharactersDeletionUser$',
    '^DRAExperiment$',
    '^DRAUser$',
    '^ChatCancelled$',
    '^ChatTurn$',
    '^ContainsTextEvaluator$',
    '^Evaluation$',
    '^Evaluator$',
    '^EvaluatorSetup$',
    '^FITDUser$',
    '^FITDExperiment$',
    '^GOATExperiment$',
    '^GOATUser$',
    '^LLMChat$',
    '^Message$',
    '^ModelEvaluationError$',
    '^ModelEvaluator$',
    '^ModelRole$',
    '^ModelVerdictError$',
    '^OpenAIAuthenticationError$',
    '^OpenAIChat$',
    '^OpenAIContentError$',
    '^OpenAIError$',
    '^OpenAIHTTPError$',
    '^OpenAIJSONError$',
    '^OpenAIRateLimitError$',
    '^OpenAIResponseError$',
    '^OpenAITimeoutError$',
    '^OpenAITransportError$',
    '^Progress$',
    '^QwenChat$',
    '^QwenContextError$',
    '^QwenError$',
    '^RunEvent$',
    '^RunJournal$',
    '^RunRecord$',
    '^RunSnapshot$',
    '^User$',
    '^UserState$',
    '^UserStatus$',
    '^capture_run$',
    '^load_alert_manifest$',
    '^save_run$',
    '^select_alert_records$',
]

# Each component's package interface matches its explicit __all__.
[[interfaces]]
from = ['^alert$']
expose = ['^AlertManifest$', '^AlertRecord$', '^load_alert_manifest$', '^select_alert_records$']

[[interfaces]]
from = ['^attacks\.fitd$']
expose = ['^FITDExperiment$', '^FITDUser$']

[[interfaces]]
from = ['^attacks\.goat$']
expose = ['^GOATExperiment$', '^GOATUser$']

[[interfaces]]
from = ['^attacks\.autodan$']
expose = ['^AutoDANExperiment$', '^AutoDANUser$']

[[interfaces]]
from = ['^attacks\.adaptive_attacks$']
expose = ['^AdaptiveAttacksExperiment$', '^AdaptiveAttacksUser$']

[[interfaces]]
from = ['^attacks\.badchars$']
expose = ['^BadCharactersDeletionExperiment$', '^BadCharactersDeletionUser$']

[[interfaces]]
from = ['^core\.chats$']
expose = ['^ChatCancelled$', '^ChatTurn$', '^LLMChat$', '^ModelRole$']

[[interfaces]]
from = ['^core\.evaluation$']
expose = ['^EvaluationChat$', '^Evaluator$', '^evaluate$']

[[interfaces]]
from = ['^core\.runs$']
expose = ['^Evaluation$', '^Progress$', '^RunSnapshot$', '^User$', '^UserState$', '^UserStatus$']

[[interfaces]]
from = ['^core\.primitives\.messages$']
expose = ['^Message$']

[[interfaces]]
from = ['^core\.primitives\.diagnostics$']
expose = ['^DiagnosticObject$', '^DiagnosticRedactor$']

# Namespace containers have no symbol facade of their own.
[[interfaces]]
from = ['^app$', '^attacks$', '^attacks\.shared$', '^core$', '^core\.primitives$']
expose = []

# Descriptive leaf modules retain the public-symbol rule at every used depth.
[[interfaces]]
from = [
    '^app\.[^.]+$',
    '^alert\.[^.]+$',
    '^attacks\.fitd\.[^.]+$',
    '^attacks\.(shared|adaptive_attacks|autodan|badchars|dra|goat)\.[^.]+$',
    '^core\.(chats|evaluation|runs)\.[^.]+$',
    '^core\.primitives\.(messages|diagnostics)\.[^.]+$',
]
expose = ['^[A-Za-z][A-Za-z0-9_]*$']

[rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"
unused_external_dependencies = "error"
