[[modules]]
path = "core"
layer = "Domain"
depends_on = []

[[modules]]
path = "core.chats"
layer = "Domain"
depends_on = ["core.chats.conversation"]

[[modules]]
path = "core.chats.conversation"
layer = "Domain"
depends_on = ["core.primitives.diagnostics", "core.primitives.messages"]

# OpenAI launches the adjacent http_worker.py by filename, not by Python import.
