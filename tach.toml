# The root facade exposes exactly the documented src/tai/__init__.py API.
[[interfaces]]
from = ['^tai$']
expose = [
    '^AlertManifest$',
    '^AlertRecord$',
    '^ChatCancelled$',
    '^ChatTurn$',
    '^ContainsTextEvaluator$',
    '^Evaluation$',
    '^Evaluator$',
    '^EvaluatorSetup$',
    '^FITDUser$',
    '^FITDExperiment$',
    '^LLMChat$',
    '^Message$',
    '^ModelEvaluationError$',
    '^ModelEvaluator$',
    '^ModelRole$',
    '^ModelVerdictError$',
    '^OpenAIAuthenticationError$',
    '^OpenAIChat$',
    '^OpenAIContentError$',
    '^OpenAIError$',
    '^OpenAIHTTPError$',
    '^OpenAIJSONError$',
    '^OpenAIRateLimitError$',
    '^OpenAIResponseError$',
    '^OpenAITimeoutError$',
    '^OpenAITransportError$',
    '^Progress$',
    '^QwenChat$',
    '^QwenContextError$',
    '^QwenError$',
    '^RunEvent$',
    '^RunJournal$',
    '^RunRecord$',
    '^RunSnapshot$',
    '^User$',
    '^UserState$',
    '^UserStatus$',
    '^capture_run$',
    '^load_alert_manifest$',
    '^save_run$',
    '^select_alert_records$',
]

# Each component's package interface matches its explicit __all__.
[[interfaces]]
from = ['^tai\.alert$']
expose = ['^AlertManifest$', '^AlertRecord$', '^load_alert_manifest$', '^select_alert_records$']

[[interfaces]]
from = ['^tai\.attacks\.fitd$']
expose = ['^FITDExperiment$', '^FITDUser$']

[[interfaces]]
from = ['^tai\.core\.chats$']
expose = ['^ChatCancelled$', '^ChatTurn$', '^LLMChat$', '^ModelRole$']

[[interfaces]]
from = ['^tai\.core\.evaluation$']
expose = ['^EvaluationChat$', '^Evaluator$', '^evaluate$']

[[interfaces]]
from = ['^tai\.core\.runs$']
expose = ['^Evaluation$', '^Progress$', '^RunSnapshot$', '^User$', '^UserState$', '^UserStatus$']

[[interfaces]]
from = ['^tai\.core\.primitives\.messages$']
expose = ['^Message$']

[[interfaces]]
from = ['^tai\.core\.primitives\.diagnostics$']
expose = ['^DiagnosticObject$', '^DiagnosticRedactor$']

# Namespace containers have no symbol facade of their own.
[[interfaces]]
from = ['^tai\.app$', '^tai\.attacks$', '^tai\.core$', '^tai\.core\.primitives$']
expose = []

# Descriptive leaf modules retain the public-symbol rule at every used depth.
[[interfaces]]
from = [
    '^tai\.app\.[^.]+$',
    '^tai\.alert\.[^.]+$',
    '^tai\.attacks\.fitd\.[^.]+$',
    '^tai\.core\.(chats|evaluation|runs)\.[^.]+$',
    '^tai\.core\.primitives\.(messages|diagnostics)\.[^.]+$',
]
expose = ['^[A-Za-z][A-Za-z0-9_]*$']

[rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"
unused_external_dependencies = "error"
