source_roots = ["src"]
exact = true
ignore_type_checking_imports = false
root_module = "forbid"
forbid_circular_dependencies = true
layers_explicit_depends_on = true
respect_gitignore = false
# Packages group cohesive components; file boundaries retain their layer checks.
# Contract package exports stay independent of concrete adapters and assembly.
# The linear order is supplemented below: Interface cannot import Infrastructure,
# and Infrastructure cannot import UseCase, even with an explicit dependency.
layers = ["Bootstrap", "Interface", "Infrastructure", "UseCase", "Domain"]
exclude = [".git/**", "**/.git/**", ".venv/**", "**/.venv/**", "venv/**", "**/venv/**", "__pycache__/**", "**/__pycache__/**", ".mypy_cache/**", "**/.mypy_cache/**", ".pytest_cache/**", "**/.pytest_cache/**", ".ruff_cache/**", "**/.ruff_cache/**", ".tox/**", "**/.tox/**", ".nox/**", "**/.nox/**", ".eryx/**", "**/.eryx/**", "node_modules/**", "**/node_modules/**", "build/**", "**/build/**", "dist/**", "**/dist/**", "vendor/**", "**/vendor/**", "vendored/**", "**/vendored/**", "_vendor/**", "**/_vendor/**", "generated/**", "**/generated/**", "_generated/**", "**/_generated/**", "migrations/**", "**/migrations/**", "tests/**", "**/tests/**", "**/test/**"]

