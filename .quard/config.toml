# Editable consumer settings. Run quard/apply.py after changing readability or scope.
# The required Pylint profile always runs; checks below select optional independent jobs.
[checks]
constructor_purity = true
lambda_injection = true
lcom4 = true
method_decorators = true
instance_fields = true
class_contracts = true
contract_folders = true
test_placement = true
outer_classes = true
free_function_placement = true
leading_underscores = true
cached_property_migration = true
encapsulated_only = true
pyright = true
pydoclint = true
duplicate_detection = true
tach = true
dependency_types = true
tuple_signatures = true
stairfmt = true

# Shared minimum for exact, renamed and gap-similar Python clone jobs.
[duplication]
min_units = 3

# Pylint's own metrics; physical line length is not limited.
[readability.production]
max_module_lines = 400
max_statements = 30
max_complexity = 8
max_branches = 8
max_nested_blocks = 4
max_locals = 10
max_returns = 4
max_bool_expr = 4
max_args = 5
max_positional_arguments = 4
max_attributes = 7
max_public_methods = 12
max_parents = 3
min_public_methods = 2
min_similarity_lines = 4
max_try_statements = 1

# Unspecified test limits inherit production values.
[readability.tests]
max_module_lines = 800
max_statements = 60
max_complexity = 10
max_branches = 10
max_nested_blocks = 4
max_locals = 20
max_returns = 6
max_args = 10
max_positional_arguments = 10
max_public_methods = 30
min_public_methods = 0
max_try_statements = 3

# Source scope: exact directory basenames, not regexes or substrings.
[scope]
exclude_directory_names = [
  ".git", ".venv", "venv", "__pycache__", ".mypy_cache", ".pytest_cache",
  ".ruff_cache", ".tox", ".nox", ".quard", "node_modules", "build", "dist",
  "vendor", "vendored", "_vendor", "generated", "_generated", "migrations",
]
# Under src/ these directories use the test profile; root tests/ is always tested.
test_directory_names = ["tests", "test"]
