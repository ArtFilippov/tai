[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tai"
version = "0.1.0"
description = "Textual LLM robustness experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "garak",
    "huggingface-hub==0.30.2",
    "qraft==0.1.0",
    "transformers==4.51.3",
    "torch==2.5.1+cu121; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
qwen = [
    "torch==2.5.1+cu121; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
vllm = [
    "vllm==0.6.4.post1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.20.1+cu121; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "xformers==0.0.28.post3; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "numpy==1.26.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
gguf = [
    "llama-cpp-python[server]==0.3.36; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
tai = "main.cli:main"
tai-qwen = "main.qwen_cli:qwen_main"
tai-alert = "main.alert_series:main"
tai-goat = "main.goat_cli:main"
tai-threaten-json = "main.threaten_json_cli:main"
tai-qwen-observe = "main.qwen_observe:main"
tai-qwen-search = "main.qwen_observe:search_main"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[dependency-groups]
dev = [
    "pytest>=8",
    "tach==0.35.1",
    "pylint==4.0.8",
    "clean-architecture-linter-plugin==1.2.2",
    "pyright[nodejs]==1.1.414",
    "pydoclint==0.9.1",
    "tomlkit==0.13.3",
    "packaging==25.0",
    "jsonschema==4.26.0",
    "quard-clones==0.1.0",
]

[tool.uv]
# garak rejects resource symlinks that resolve outside its installed data directory.
link-mode = "copy"
no-binary-package = ["llama-cpp-python"]

[tool.uv.extra-build-variables]
llama-cpp-python = { CMAKE_ARGS = "-DGGML_CUDA=on" }

[tool.uv.sources]
garak = { git = "https://github.com/NVIDIA/garak.git", rev = "3f50ea5ff9cd7050099940647c15c39b07a93392" }
torch = { index = "pytorch-cu121", extra = "qwen" }
torchvision = { index = "pytorch-cu121", extra = "vllm" }
xformers = { index = "pytorch-cu121", extra = "vllm" }

[tool.uv.sources.quard-clones]
git = "ssh://git@github.com/ArtFilippov/quard.git"
rev = "9c4a9d3c4f93a137eb7add701a30cca830310d1d"
subdirectory = "rust/quard-clones"

[tool.uv.sources.qraft]
git = "ssh://git@github.com/ArtFilippov/quard.git"
rev = "9c4a9d3c4f93a137eb7add701a30cca830310d1d"
subdirectory = "runtime/qraft"
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# Runtime closure of the pinned text-only probes; AutoDAN uses bundled resources
# and local Qwen logits without importing garak's GPU/plugin execution path.
# garak's distribution makes every provider and GPU backend mandatory; this
# application only supports its private text-only integration (see README).
[[tool.uv.dependency-metadata]]
name = "garak"
version = "0.17.1.pre1"
requires-python = ">=3.11"
requires-dist = ["colorama>=0.4.3", "tqdm>=4.67.1", "PyYAML>=6", "xdg-base-dirs>=6.0.1", "langdetect==1.0.9", "nltk==3.9.1", "rich==15.0.0"]


[tool.uv.dependency-groups.dev]
requires-python = ">=3.12"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real_qwen'"
markers = ["real_qwen: runs FITD against pinned local Qwen weights on CUDA"]

[tool.pylint.main]
load-plugins = ["pylint.extensions.bad_builtin", "pylint.extensions.broad_try_clause", "pylint.extensions.check_elif", "pylint.extensions.code_style", "pylint.extensions.comparison_placement", "pylint.extensions.confusing_elif", "pylint.extensions.consider_refactoring_into_while_condition", "pylint.extensions.consider_ternary_expression", "pylint.extensions.dict_init_mutate", "pylint.extensions.docstyle", "pylint.extensions.dunder", "pylint.extensions.empty_comment", "pylint.extensions.eq_without_hash", "pylint.extensions.for_any_all", "pylint.extensions.magic_value", "pylint.extensions.mccabe", "pylint.extensions.no_self_use", "pylint.extensions.overlapping_exceptions", "pylint.extensions.private_import", "pylint.extensions.redefined_loop_name", "pylint.extensions.redefined_variable_type", "pylint.extensions.set_membership", "pylint.extensions.typing", "pylint.extensions.while_used"]
jobs = 1
persistent = false
fail-under = 0
fail-on = ["I"]
recursive = true
py-version = "3.12"
ignore-paths = ["(?:^|[/\\\\])(?:\\.git|\\.venv|venv|__pycache__|\\.mypy_cache|\\.pytest_cache|\\.ruff_cache|\\.tox|\\.nox|\\.quard|node_modules|build|dist|vendor|vendored|_vendor|generated|_generated|migrations|\\.ipynb_checkpoints)(?:[/\\\\]|$)"]

[tool.pylint.messages_control]
enable = ["all"]
disable = ["missing-module-docstring", "missing-class-docstring", "missing-function-docstring", "reimported", "undefined-variable", "used-before-assignment", "possibly-used-before-assignment", "line-too-long"]

[tool.pylint.reports]
reports = false
score = false
output-format = "json2"

[tool.pylint.format]
indent-string = "    "
indent-after-paren = 4
single-line-if-stmt = false
single-line-class-stmt = false
max-module-lines = 400

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
min-similarity-lines = 4

[tool.pylint.design]
ignored-parents = ["builtins.BaseException", "builtins.Exception", "builtins.RuntimeError", "builtins.OSError", "builtins.TimeoutError", "typing.Protocol", "typing_extensions.Protocol", "enum.Enum", "enum.StrEnum", "garak.probes.base.Probe"]
max-statements = 30
max-complexity = 8
max-branches = 8
max-locals = 10
max-returns = 4
max-bool-expr = 4
max-args = 5
max-positional-arguments = 4
max-attributes = 7
max-public-methods = 12
max-parents = 3
min-public-methods = 2

[tool.pylint.refactoring]
max-nested-blocks = 4

[tool.pylint.broad_try_clause]
max-try-statements = 1

[tool.pyright]
stubPath = "typings"
include = ["src", "tests"]
exclude = [".git/**", "**/.git/**", ".venv/**", "**/.venv/**", "venv/**", "**/venv/**", "__pycache__/**", "**/__pycache__/**", ".mypy_cache/**", "**/.mypy_cache/**", ".pytest_cache/**", "**/.pytest_cache/**", ".ruff_cache/**", "**/.ruff_cache/**", ".tox/**", "**/.tox/**", ".nox/**", "**/.nox/**", ".quard/**", "**/.quard/**", "node_modules/**", "**/node_modules/**", "build/**", "**/build/**", "dist/**", "**/dist/**", "vendor/**", "**/vendor/**", "vendored/**", "**/vendored/**", "_vendor/**", "**/_vendor/**", "generated/**", "**/generated/**", "_generated/**", "**/_generated/**", "migrations/**", "**/migrations/**", ".ipynb_checkpoints/**", "**/.ipynb_checkpoints/**"]
ignore = [".git/**", "**/.git/**", ".venv/**", "**/.venv/**", "venv/**", "**/venv/**", "__pycache__/**", "**/__pycache__/**", ".mypy_cache/**", "**/.mypy_cache/**", ".pytest_cache/**", "**/.pytest_cache/**", ".ruff_cache/**", "**/.ruff_cache/**", ".tox/**", "**/.tox/**", ".nox/**", "**/.nox/**", ".quard/**", "**/.quard/**", "node_modules/**", "**/node_modules/**", "build/**", "**/build/**", "dist/**", "**/dist/**", "vendor/**", "**/vendor/**", "vendored/**", "**/vendored/**", "_vendor/**", "**/_vendor/**", "generated/**", "**/generated/**", "_generated/**", "**/_generated/**", "migrations/**", "**/migrations/**", ".ipynb_checkpoints/**", "**/.ipynb_checkpoints/**"]
typeCheckingMode = "strict"
pythonPlatform = "Linux"
extraPaths = ["src"]
pythonVersion = "3.12"
analyzeUnannotatedFunctions = true
enableReachabilityAnalysis = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
deprecateTypingAliases = true
enableExperimentalFeatures = false
reportImportCycles = "none"
reportCallInDefaultInitializer = "error"
reportImplicitOverride = "error"
reportImplicitStringConcatenation = "none"
reportMissingSuperCall = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnreachable = "error"
reportUnusedCallResult = "error"
reportMissingModuleSource = "error"
reportDuplicateImport = "error"
reportUndefinedVariable = "error"
reportUnboundVariable = "error"
reportPossiblyUnboundVariable = "error"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["src"]
reportPrivateUsage = "none"
reportUnusedCallResult = "none"

[[tool.pyright.executionEnvironments]]
root = "src/target/gguf/envelopes"
extraPaths = ["src"]
reportMissingSuperCall = "none"
reportImplicitOverride = "none"

[[tool.pyright.executionEnvironments]]
root = "src/attack/envelopes"
extraPaths = ["src"]
reportMissingSuperCall = "none"
reportImplicitOverride = "none"

[[tool.pyright.executionEnvironments]]
root = "src/target/envelopes"
extraPaths = ["src"]
reportMissingSuperCall = "none"
reportImplicitOverride = "none"

[[tool.pyright.executionEnvironments]]
root = "src"
extraPaths = ["src"]
[tool.pydoclint]
style = "google"
quiet = true
exclude = "(?:^|[/\\\\])(?:\\.git|\\.venv|venv|__pycache__|\\.mypy_cache|\\.pytest_cache|\\.ruff_cache|\\.tox|\\.nox|\\.quard|node_modules|build|dist|vendor|vendored|_vendor|generated|_generated|migrations|\\.ipynb_checkpoints)(?:[/\\\\]|$)"
skip-checking-short-docstrings = false
skip-checking-private-functions = false
skip-checking-raises = false
check-arg-order = true
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = true
check-return-types = true
check-yield-types = true
check-class-attributes = true
should-document-private-class-attributes = true
ignore-underscore-args = false
ignore-private-args = false
should-document-star-arguments = true
check-style-mismatch = true
check-arg-defaults = true
allow-init-docstring = true
require-inline-class-var-docs = false
require-return-section-when-returning-nothing = false
show-filenames-in-every-violation-message = true
auto-regenerate-baseline = false
